<svg width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Webhole DNS Enforce architecture</title>
  <desc id="arch-desc">Chrome with DoH off, optional PAC to local gateway, DNS stub, /etc/resolver, and SSH tunnels.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
      .c1{fill:#eff6ff;stroke:#60a5fa}.c2{fill:#eef2ff;stroke:#818cf8}
      .c3{fill:#f0fdf4;stroke:#4ade80}.c4{fill:#ecfeff;stroke:#22d3ee}
      .c5{fill:#fff7ed;stroke:#fb923c}.c6{fill:#faf5ff;stroke:#c084fc}
      .t{fill:#0f172a;font:700 18px system-ui,sans-serif}
      .l{fill:#0f172a;font:700 13px system-ui,sans-serif}
      .s{fill:#475569;font:12px system-ui,sans-serif}
      .e{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}
      .eg{stroke:#059669;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="bg" width="1040" height="680" rx="20"/>
  <text class="t" x="36" y="40">Webhole v0.4 — DNS Enforce</text>
  <text class="s" x="36" y="62">Three gates: /etc/resolver + Chrome DoH off + resolve-then-proxy gateway</text>

  <rect class="card c1" x="36" y="100" width="200" height="100" rx="12"/>
  <text class="l" x="90" y="140">Chrome</text>
  <text class="s" x="56" y="164">DoH forced off</text>
  <text class="s" x="56" y="182">PAC / proxy</text>

  <rect class="card c2" x="300" y="100" width="200" height="100" rx="12"/>
  <text class="l" x="340" y="140">background.js</text>
  <text class="s" x="320" y="164">privacy + PAC</text>
  <text class="s" x="320" y="182">native messages</text>

  <rect class="card c3" x="580" y="90" width="220" height="120" rx="12"/>
  <text class="l" x="620" y="130">native host.js</text>
  <text class="s" x="600" y="154">dns / gateway / ssh</text>
  <text class="s" x="600" y="172">auto /etc/resolver</text>
  <text class="s" x="600" y="190">state.json</text>

  <rect class="card c4" x="36" y="300" width="220" height="100" rx="12"/>
  <text class="l" x="70" y="340">dns-daemon :53535</text>
  <text class="s" x="56" y="364">suffix → upstream</text>
  <text class="s" x="56" y="382">NXDOMAIN if empty</text>

  <rect class="card c5" x="300" y="300" width="220" height="100" rx="12"/>
  <text class="l" x="330" y="340">proxy-gateway</text>
  <text class="s" x="320" y="364">:18080 CONNECT</text>
  <text class="s" x="320" y="382">resolve only via stub</text>

  <rect class="card c5" x="580" y="300" width="220" height="100" rx="12"/>
  <text class="l" x="620" y="340">ssh -D SOCKS</text>
  <text class="s" x="600" y="364">by IP after resolve</text>
  <text class="s" x="600" y="382">no remote DNS</text>

  <rect class="card c6" x="300" y="460" width="220" height="90" rx="12"/>
  <text class="l" x="340" y="500">/etc/resolver/*</text>
  <text class="s" x="320" y="524">→ 127.0.0.1:53535</text>

  <rect class="card" x="580" y="460" width="220" height="90" rx="12"/>
  <text class="l" x="620" y="500">Upstream NS</text>
  <text class="s" x="600" y="524">corp / 1.1.1.1 / via -L</text>

  <path class="e" d="M236 150 H300"/>
  <path class="e" d="M500 150 H580"/>
  <path class="eg" d="M650 210 V300"/>
  <path class="eg" d="M620 210 C620 250 410 250 410 300"/>
  <path class="eg" d="M690 210 C720 250 690 270 690 300"/>
  <path class="eg" d="M520 350 H580"/>
  <path class="e" d="M146 300 V250 H400 V210"/>
  <path class="eg" d="M410 400 V460"/>
  <path class="eg" d="M146 400 C146 520 580 520 580 505"/>

  <text class="s" x="36" y="600">Direct + DNS: browser uses system resolver stubs. Global/Routes + DNS: traffic hits gateway so Chrome cannot remote-resolve via SOCKS.</text>
  <text class="s" x="36" y="624">Matched rule + no answer → NXDOMAIN (no silent fallthrough to VPN corp DNS).</text>
</svg>
