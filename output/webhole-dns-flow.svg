<svg width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="dns-flow-title dns-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dns-flow-title">Webhole Split DNS query flow</title>
  <desc id="dns-flow-desc">Sequence-style flowchart of a DNS query: client to local stub, longest-suffix rule match, direct upstream or ssh -L forward to remote nameserver, then response and optional cache.</desc>
  <defs>
    <marker id="dnsf-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2" />
    </marker>
    <filter id="dnsf-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#dnsf-shadow); }
      .card-client { fill: #eff6ff; stroke: #60a5fa; }
      .card-stub { fill: #ecfeff; stroke: #22d3ee; }
      .card-match { fill: #fefce8; stroke: #facc15; }
      .card-up { fill: #f0fdf4; stroke: #4ade80; }
      .card-ssh { fill: #fff7ed; stroke: #fb923c; }
      .card-cache { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5 4; }
      .title { fill: #0f172a; font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #475569; font: 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { stroke: #0891b2; stroke-width: 2.2; fill: none; marker-end: url(#dnsf-arrow); }
      .edge-alt { stroke: #ea580c; stroke-width: 2.2; fill: none; marker-end: url(#dnsf-arrow); }
      .edge-label { fill: #0e7490; font: 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge-label-alt { fill: #c2410c; font: 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #164e63; font: 700 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1040" height="580" rx="24" />
  <text class="title" x="36" y="44">Split DNS Query Flow</text>
  <text class="small" x="36" y="66">Longest domain suffix wins. Unmatched queries use Default upstream. Stub binds 127.0.0.1 only.</text>

  <rect class="card card-client" x="40" y="110" width="160" height="90" rx="14" />
  <text class="step" x="56" y="136">1</text>
  <text class="label" x="78" y="150">Client</text>
  <text class="small" x="56" y="174">dig / OS / app</text>

  <rect class="card card-stub" x="280" y="100" width="200" height="110" rx="14" />
  <text class="step" x="296" y="128">2</text>
  <text class="label" x="318" y="142">dns-daemon</text>
  <text class="small" x="296" y="166">127.0.0.1:53535 UDP</text>
  <text class="small" x="296" y="184">parse QNAME</text>

  <rect class="card card-match" x="560" y="100" width="200" height="110" rx="14" />
  <text class="step" x="576" y="128">3</text>
  <text class="label" x="598" y="142">Rule match</text>
  <text class="small" x="576" y="166">longest suffix</text>
  <text class="small" x="576" y="184">or Default</text>

  <rect class="card card-cache" x="840" y="110" width="160" height="90" rx="14" />
  <text class="label" x="882" y="150">Cache</text>
  <text class="small" x="856" y="174">TTL 30–300s</text>

  <rect class="card card-up" x="200" y="320" width="220" height="110" rx="14" />
  <text class="step" x="216" y="348">4a</text>
  <text class="label" x="248" y="362">Direct upstream</text>
  <text class="small" x="216" y="386">nameserver IP:port</text>
  <text class="small" x="216" y="404">UDP forward</text>

  <rect class="card card-ssh" x="520" y="320" width="240" height="110" rx="14" />
  <text class="step" x="536" y="348">4b</text>
  <text class="label" x="568" y="362">Via SSH Host</text>
  <text class="small" x="536" y="386">ssh -L local → remote NS</text>
  <text class="small" x="536" y="404">then UDP to 127.0.0.1:N</text>

  <rect class="card card-client" x="360" y="470" width="280" height="70" rx="14" />
  <text class="step" x="376" y="498">5</text>
  <text class="label" x="400" y="512">Response to client</text>
  <text class="small" x="560" y="512">preserve TXID</text>

  <path class="edge" d="M200 155 H280" />
  <text class="edge-label" x="218" y="145">query</text>

  <path class="edge" d="M480 155 H560" />
  <text class="edge-label" x="500" y="145">match</text>

  <path class="edge" d="M760 140 H840" />
  <text class="edge-label" x="780" y="130">hit?</text>

  <path class="edge" d="M640 210 V280 C640 300 310 300 310 320" />
  <text class="edge-label" x="420" y="290">kind=direct</text>

  <path class="edge-alt" d="M680 210 V280 C680 300 640 300 640 320" />
  <text class="edge-label-alt" x="690" y="290">kind=via_ssh</text>

  <path class="edge" d="M310 430 V455 C310 470 420 470 420 470" />
  <path class="edge-alt" d="M640 430 V455 C640 470 580 470 580 470" />

  <path class="edge" d="M920 200 V500 H640" />
  <text class="edge-label" x="930" y="360">cached</text>

  <text class="small" x="36" y="560">Chrome SOCKS paths may still resolve remotely; Split DNS primarily helps DIRECT traffic, CLI tools, and apps using system/resolver stubs.</text>
</svg>
