<svg width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="df-title df-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="df-title">DNS Enforce flow</title>
  <desc id="df-desc">Browser path through DoH off, resolver or gateway, stub, and upstream nameserver.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
      .c1{fill:#eff6ff;stroke:#60a5fa}.c2{fill:#ecfeff;stroke:#22d3ee}
      .c3{fill:#fefce8;stroke:#facc15}.c4{fill:#f0fdf4;stroke:#4ade80}
      .c5{fill:#fff7ed;stroke:#fb923c}
      .t{fill:#0f172a;font:700 18px system-ui,sans-serif}
      .l{fill:#0f172a;font:700 13px system-ui,sans-serif}
      .s{fill:#475569;font:12px system-ui,sans-serif}
      .e{stroke:#0891b2;stroke-width:2;fill:none;marker-end:url(#ar)}
      .step{fill:#164e63;font:700 11px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1040" height="600" rx="20"/>
  <text class="t" x="36" y="40">DNS Enforce — browser path</text>
  <text class="s" x="36" y="62">Goal: configured domain always uses Webhole rules (including negative tests to 1.1.1.1).</text>

  <rect class="card c1" x="40" y="100" width="160" height="90" rx="12"/>
  <text class="step" x="56" y="128">1</text>
  <text class="l" x="80" y="142">Chrome</text>
  <text class="s" x="56" y="166">DoH = off</text>

  <rect class="card c2" x="260" y="90" width="200" height="110" rx="12"/>
  <text class="step" x="276" y="120">2a</text>
  <text class="l" x="310" y="134">/etc/resolver</text>
  <text class="s" x="276" y="158">system dig / Direct</text>
  <text class="s" x="276" y="176">→ 127.0.0.1:53535</text>

  <rect class="card c5" x="520" y="90" width="200" height="110" rx="12"/>
  <text class="step" x="536" y="120">2b</text>
  <text class="l" x="560" y="134">gateway :18080</text>
  <text class="s" x="536" y="158">Routes/Global PAC</text>
  <text class="s" x="536" y="176">CONNECT → stub only</text>

  <rect class="card c2" x="780" y="100" width="200" height="90" rx="12"/>
  <text class="step" x="796" y="128">3</text>
  <text class="l" x="820" y="142">dns-daemon</text>
  <text class="s" x="796" y="166">rule match</text>

  <rect class="card c3" x="200" y="300" width="220" height="100" rx="12"/>
  <text class="step" x="216" y="330">4</text>
  <text class="l" x="250" y="344">Upstream NS</text>
  <text class="s" x="216" y="368">1.1.1.1 or 10.x</text>
  <text class="s" x="216" y="386">or via ssh -L</text>

  <rect class="card c4" x="520" y="300" width="240" height="100" rx="12"/>
  <text class="step" x="536" y="330">5</text>
  <text class="l" x="560" y="344">Result</text>
  <text class="s" x="536" y="368">A → connect by IP</text>
  <text class="s" x="536" y="386">empty → NXDOMAIN / 502</text>

  <rect class="card c1" x="320" y="470" width="360" height="70" rx="12"/>
  <text class="l" x="360" y="510">No fallthrough to VPN corp DNS</text>

  <path class="e" d="M200 145 H260"/>
  <path class="e" d="M200 145 C230 200 520 200 520 145"/>
  <path class="e" d="M460 145 H520"/>
  <path class="e" d="M720 145 H780"/>
  <path class="e" d="M880 190 V280 C880 300 310 300 310 300"/>
  <path class="e" d="M420 350 H520"/>
  <path class="e" d="M640 400 V470"/>
</svg>
